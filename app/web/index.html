<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>DCA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/explorer.js"></script>
<style>
  :root {
    --bg: #F3F3EF; --surface: #FFFFFF; --text: #0D0E10; --mute: #8B9098; --faint: #D9DAD6;
    --line: rgba(13, 14, 16, 0.07); --accent: #0FA958; --on-accent: #FFFFFF; --bad: #E5484D; --sell: #E0662F; --soft: #F3F3EF;
    --shadow: 0 1px 2px rgba(13, 14, 16, 0.04), 0 8px 24px rgba(13, 14, 16, 0.05);
  }
  :root[data-theme="dark"] {
    --bg: #0A0B0D; --surface: #141619; --text: #F5F6F7; --mute: #6C737C; --faint: #2A2E33;
    --line: rgba(255, 255, 255, 0.07); --accent: #C6F53A; --on-accent: #0A0B0D; --bad: #FF6369; --sell: #FF8A4C; --soft: #0A0B0D;
    --shadow: none;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A0B0D; --surface: #141619; --text: #F5F6F7; --mute: #6C737C; --faint: #2A2E33;
      --line: rgba(255, 255, 255, 0.07); --accent: #C6F53A; --on-accent: #0A0B0D; --bad: #FF6369; --sell: #FF8A4C; --soft: #0A0B0D;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); }
  body { color: var(--text); min-height: 100vh;
         font: 16px/1.3 ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         padding: 20px 16px calc(110px + env(safe-area-inset-bottom)); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }

  /* шапка и главное число дня */
  .top { display: flex; justify-content: space-between; align-items: center; color: var(--mute); font-size: 14px; font-weight: 600; }
  .chip { background: var(--surface); border-radius: 999px; padding: 7px 12px; box-shadow: var(--shadow); color: var(--text); }
  .chip span { color: var(--mute); margin-right: 4px; }
  .verb { margin: 22px 2px 0; font-size: 15px; font-weight: 700; color: var(--mute); }
  .hero { margin: 2px 2px 0; font-size: 72px; line-height: 0.98; font-weight: 800; }
  .hero small { font-size: 0.5em; font-weight: 700; color: var(--mute); margin-right: 2px; vertical-align: 0.42em; }
  .hero.ok { color: var(--accent); } .hero.sell { color: var(--sell); } .hero.calm { font-size: 40px; line-height: 1.1; padding: 14px 0 6px; }
  .also { margin: 6px 2px 0; font-size: 17px; font-weight: 750; color: var(--sell); }
  .purse { display: flex; gap: 8px; margin: 16px 0 18px; }
  .purse div { flex: 1; min-width: 0; background: var(--surface); border-radius: 16px; padding: 10px 14px; box-shadow: var(--shadow); }
  .purse small { display: block; color: var(--mute); font-size: 12px; font-weight: 650; }
  .purse b { font-size: 18px; font-weight: 750; }

  /* список активов */
  .list { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
  .item { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px; padding: 14px 14px 14px 18px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item:active { background: var(--line); }
  .sym { min-width: 0; }
  .sym b { display: block; font-size: 19px; font-weight: 750; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sym small { display: block; color: var(--mute); font-size: 13px; font-weight: 600; margin-top: 2px; line-height: 1.3; }
  .sym small i { font-style: normal; font-weight: 750; color: var(--accent); } .sym small i.s { color: var(--sell); }
  .amt { font-size: 21px; font-weight: 750; text-align: right; }
  .amt.zero { color: var(--faint); } .amt.sell { color: var(--sell); }
  .check { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--faint); display: grid; place-items: center; transition: transform 0.15s, background 0.2s, border-color 0.2s; }
  .check:active { transform: scale(0.86); }
  .check svg { width: 18px; height: 18px; stroke: var(--on-accent); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
  .check.none { visibility: hidden; }
  .item.done .check { background: var(--accent); border-color: var(--accent); animation: pop 0.3s; }
  .item.done .check svg { opacity: 1; }
  .item.done .sym, .item.done .amt { opacity: 0.35; }
  .item.bad .amt { font-size: 13px; color: var(--bad); font-weight: 600; letter-spacing: 0; }
  @keyframes pop { 50% { transform: scale(1.18); } }
  .empty { text-align: center; color: var(--mute); padding: 70px 0; font-weight: 600; }

  /* кнопки внизу */
  .dock { position: fixed; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom)); display: flex; gap: 12px; z-index: 5; }
  .fab { width: 60px; height: 60px; border-radius: 50%; background: var(--text); color: var(--bg); display: grid; place-items: center; box-shadow: 0 10px 28px rgba(0,0,0,0.28); transition: transform 0.15s; }
  .fab.alt { background: var(--surface); color: var(--text); }
  .fab:active { transform: scale(0.9); }
  .fab svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  /* шторка */
  .veil { position: fixed; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity 0.22s; z-index: 10; display: flex; align-items: flex-end; }
  .veil.open { opacity: 1; pointer-events: auto; }
  .sheet { width: 100%; background: var(--surface); border-radius: 26px 26px 0 0; padding: 10px 18px calc(24px + env(safe-area-inset-bottom));
           max-height: 93vh; overflow: auto; transform: translateY(24px); transition: transform 0.26s cubic-bezier(.2,.8,.2,1); }
  .veil.open .sheet { transform: none; }
  .sheet.full { height: 100%; max-height: none; border-radius: 0; padding-top: calc(16px + env(safe-area-inset-top)); }
  .grab { width: 38px; height: 4px; border-radius: 2px; background: var(--faint); margin: 0 auto 16px; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .title { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .price { color: var(--mute); font-weight: 600; margin-top: 6px; font-size: 15px; }
  .icon { width: 40px; height: 40px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; color: var(--bad); flex: none; }
  .icon svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  h3 { font-size: 13px; font-weight: 750; color: var(--mute); letter-spacing: 0.05em; text-transform: uppercase; margin: 26px 2px 10px; }

  /* действие дня в карточке актива */
  .act { margin-top: 20px; border-radius: 20px; padding: 16px 18px; background: var(--soft); }
  .act b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .act.buy b { color: var(--accent); } .act.sell b { color: var(--sell); }
  .act p { margin: 6px 0 0; color: var(--mute); font-size: 14px; font-weight: 600; line-height: 1.35; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .cell { background: var(--soft); border-radius: 16px; padding: 10px 14px; min-width: 0; }
  .cell small { display: block; color: var(--mute); font-size: 12px; font-weight: 650; }
  .cell b { font-size: 17px; font-weight: 750; overflow-wrap: anywhere; } .cell b.up { color: var(--accent); } .cell b.down { color: var(--sell); }

  /* рынок сейчас: правила стратегии со шкалами */
  .rule { border-radius: 18px; padding: 12px 14px; background: var(--soft); margin-bottom: 8px; transition: box-shadow 0.2s; }
  .rule.on { box-shadow: inset 0 0 0 2px var(--accent); } .rule.on.sell { box-shadow: inset 0 0 0 2px var(--sell); }
  .rule .rh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .rule .rh b { font-size: 16px; font-weight: 750; } .rule .rh span { font-size: 13px; font-weight: 700; color: var(--mute); white-space: nowrap; }
  .rule.on .rh span { color: var(--accent); } .rule.on.sell .rh span { color: var(--sell); }
  .rule p { margin: 8px 0 0; color: var(--mute); font-size: 13px; font-weight: 600; line-height: 1.35; }
  .g { margin-top: 10px; }
  .g .gl { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 650; color: var(--mute); }
  .g .gl em { font-style: normal; color: var(--text); font-weight: 750; } .g .gl em.ok { color: var(--accent); }
  .g .bar { position: relative; height: 8px; border-radius: 4px; background: var(--faint); margin-top: 6px; }
  .g .zone { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: var(--accent); opacity: 0.28; }
  .g .mark { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--mute); border-radius: 1px; }
  .g .dot { position: absolute; top: -4px; width: 16px; height: 16px; border-radius: 50%; background: var(--text); border: 3px solid var(--surface); transform: translateX(-8px); transition: left 0.6s cubic-bezier(.2,.8,.2,1); }
  .g .dot.ok { background: var(--accent); }
  .g .ghost { position: absolute; top: 1px; width: 6px; height: 6px; border-radius: 50%; background: var(--mute); opacity: 0.55; transform: translateX(-3px); }

  /* журнал сделок */
  .tr { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 11px 2px; border-bottom: 1px solid var(--line); }
  .tr:last-child { border-bottom: 0; }
  .tr b { font-weight: 750; } .tr b.s { color: var(--sell); } .tr small { display: block; color: var(--mute); font-size: 12px; font-weight: 600; }
  .tr .x { width: 30px; height: 30px; border-radius: 50%; color: var(--mute); display: grid; place-items: center; font-size: 18px; }
  .row2 { display: flex; gap: 8px; margin-top: 12px; }
  .btn { flex: 1; padding: 14px 16px; border-radius: 16px; background: var(--soft); font-weight: 750; font-size: 15px; text-align: center; }
  .btn.main { background: var(--text); color: var(--surface); } .btn:active { opacity: 0.6; } .btn[disabled] { opacity: 0.35; }

  .pills { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .pill { padding: 10px 16px; border-radius: 999px; background: var(--soft); font-weight: 700; font-size: 15px; transition: background 0.15s, color 0.15s; }
  .pill.on { background: var(--text); color: var(--surface); }
  .field { display: flex; align-items: center; gap: 6px; background: var(--soft); border-radius: 16px; padding: 4px 16px; margin-top: 10px; }
  .field span { color: var(--mute); font-weight: 700; font-size: 15px; white-space: nowrap; }
  .field input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font: inherit; font-size: 20px; font-weight: 700; padding: 12px 0; text-align: right; }
  .field.l input { text-align: left; }
  .field input::placeholder { color: var(--mute); font-weight: 600; }
  .field em { font-style: normal; color: var(--mute); font-weight: 700; font-size: 14px; }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .shot { width: 100%; max-height: 180px; object-fit: contain; border-radius: 16px; background: var(--soft); margin-top: 14px; }
  .note { margin: 12px 2px 0; color: var(--mute); font-size: 14px; font-weight: 600; line-height: 1.35; }
  .note.warn { color: var(--sell); }
  .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--faint); border-top-color: var(--text); margin: 34px auto 14px; animation: rot 0.8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } .g .dot { transition: none; } }

  .res { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 4px; border-bottom: 1px solid var(--line); }
  .res:last-child { border-bottom: 0; }
  .res:active { opacity: 0.5; }
  .res b { font-size: 17px; font-weight: 750; }
  .res div small { display: block; color: var(--mute); font-weight: 600; font-size: 13px; margin-top: 1px; max-width: 62vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res > small { color: var(--mute); font-weight: 700; font-size: 11px; letter-spacing: 0.04em; }
  .hint { color: var(--mute); text-align: center; padding: 22px 0 6px; font-weight: 600; }
  .toast { position: fixed; left: 16px; right: 16px; top: 14px; background: var(--bad); color: #fff; padding: 13px 16px; border-radius: 16px; font-weight: 650; transform: translateY(-90px); transition: transform 0.25s; z-index: 30; }
  .toast.show { transform: none; } .toast.good { background: var(--text); color: var(--bg); }
</style>
</head>
<body>
<div class="top"><div id="day"></div><button class="chip num" id="unitChip"></button></div>
<div class="verb" id="verb">&nbsp;</div>
<div class="hero num" id="hero">&nbsp;</div>
<div class="also num" id="also" hidden></div>
<div class="purse" id="purse" hidden></div>
<div id="list"></div>
<div class="dock">
  <button class="fab alt" id="scanFab" aria-label="Сделка со скриншота"><svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 012-2h2l1.5-2h5L16 6h2a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><circle cx="12" cy="12.5" r="3.5"/></svg></button>
  <button class="fab" id="fab" aria-label="Добавить актив"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<input type="file" id="file" accept="image/*" hidden>

<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg && tg.initData !== undefined) {
  try {
    tg.ready(); tg.expand();
    if (tg.colorScheme) document.documentElement.dataset.theme = tg.colorScheme;
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    tg.setHeaderColor && tg.setHeaderColor(bg); tg.setBackgroundColor && tg.setBackgroundColor(bg);
    tg.onEvent && tg.onEvent("themeChanged", () => { document.documentElement.dataset.theme = tg.colorScheme; });
  } catch (e) {}
}
const initData = tg ? tg.initData || "" : "";
let state = null;

const $ = (id) => document.getElementById(id);
const num = (x) => (Math.round(x * 100) / 100).toLocaleString("ru-RU", { maximumFractionDigits: 2 });
const big = (x) => Math.abs(x) >= 1000 ? Math.round(x).toLocaleString("ru-RU") : num(x);
const qty = (x) => Number(x).toLocaleString("ru-RU", { maximumSignificantDigits: 6 });
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = (s) => s.replace(/-USD$/, "").replace(/\d{4,}$/, "").replace(/^\^/, "").replace(/=F$/, "").replace(/\.TA$/, "");
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", "X-Tg-Init-Data": initData } });
  if (!r.ok) {
    let msg = "Ошибка " + r.status;
    try { msg = (await r.json()).detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  return r.json();
}
let toastTimer;
function toast(msg, good) { const t = $("toast"); t.textContent = msg; t.className = "toast show" + (good ? " good" : ""); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200); }
function haptic(kind) { try { kind === "ok" ? tg.HapticFeedback.notificationOccurred("success") : tg.HapticFeedback.impactOccurred("light"); } catch (e) {} }

async function load() {
  try { state = await api("/api/today"); render(); }
  catch (e) { $("hero").innerHTML = "—"; $("list").innerHTML = '<div class="empty">' + esc(e.message) + "</div>"; }
}

// короткая подпись действия для строки актива: что сделать и почему
function phrase(i) {
  if (i.reserve_mode) {
    const a = i.plan_today, why = (i.action || "").split(":")[0];
    if (i.nothing_to_sell) return `<i class="s">продавать нечего</i> · взнос в резерв`;
    if (a < 0) return `<i class="s">продать ${Math.round(-a * 100)}%</i> · ${esc(why)}`;
    if (a > 1) return `<i>взнос + ${a >= 2 ? "весь резерв" : Math.round((a - 1) * 100) + "% резерва"}</i> · ${esc(why)}`;
    return "обычный взнос";
  }
  const m = i.mult;
  return m > 1 ? `<i>×${m}</i> · ${esc(i.label || i.strategy_name)}` : m < 0 ? `<i class="s">продать ×${-m}</i> · ${esc(i.label || "")}` : m === 0 ? "пропуск" : "обычный взнос";
}

function render() {
  const d = new Date(state.day + "T00:00:00Z");
  $("day").textContent = d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", timeZone: "UTC" });
  $("unitChip").innerHTML = "<span>взнос</span>$" + num(state.unit);
  const rank = (i) => (i.done ? 2 : 0) + (i.amount ? 0 : 1);
  const items = state.items.slice().sort((a, b) => rank(a) - rank(b) || Math.abs(b.amount || 0) - Math.abs(a.amount || 0));
  const hero = $("hero"), verb = $("verb"), also = $("also");
  also.hidden = true;
  if (!items.length) {
    verb.textContent = "Сегодня"; hero.className = "hero num calm"; hero.textContent = "Пока пусто"; $("purse").hidden = true;
    $("list").innerHTML = '<div class="empty">Добавьте первый актив</div>';
    return;
  }
  const doneAny = items.some((i) => i.done), buy = state.left, sell = state.sell_left;
  if (buy > 0) { verb.textContent = "Сегодня купить"; hero.className = "hero num"; hero.innerHTML = "<small>$</small>" + big(buy); if (sell > 0) { also.hidden = false; also.textContent = "и продать на $" + big(sell); } }
  else if (sell > 0) { verb.textContent = "Сегодня продать"; hero.className = "hero num sell"; hero.innerHTML = "<small>$</small>" + big(sell); }
  else if (doneAny) { verb.textContent = "Сегодня"; hero.className = "hero num calm ok"; hero.textContent = "Всё сделано"; }
  else { verb.textContent = "Сегодня"; hero.className = "hero num calm"; hero.textContent = "Без сделок"; }
  $("purse").hidden = false;
  $("purse").innerHTML = `<div><small>В резерве</small><b class="num">$${big(state.reserve)}</b></div><div><small>В активах</small><b class="num">$${big(state.holding)}</b></div>`;
  $("list").innerHTML = '<div class="list">' + items.map(row).join("") + "</div>";
}

function row(i) {
  const s = esc(i.symbol);
  if (i.error) return `<div class="item bad" onclick="openTicker('${s}')"><div class="sym"><b>${esc(short(i.symbol))}</b></div><div class="amt">нет данных</div><div class="check none"></div></div>`;
  const a = i.amount || 0, shown = i.done ? (i.done_side === "sell" ? -i.done : i.done) : a;
  const amt = shown ? `<div class="amt num ${shown < 0 ? "sell" : ""}">${shown < 0 ? "−" : ""}$${big(Math.abs(shown))}</div>` : '<div class="amt num zero">—</div>';
  const btn = i.done || a ? `<button class="check" onclick="event.stopPropagation(); toggle('${s}')" aria-label="${i.done ? "Отменить" : "Сделано"}">${CHECK}</button>` : '<div class="check none"></div>';
  return `<div class="item ${i.done ? "done" : ""}" onclick="openTicker('${s}')"><div class="sym"><b>${esc(short(i.symbol))}</b><small>${phrase(i)}</small></div>${amt}${btn}</div>`;
}

async function toggle(symbol) {
  const i = state.items.find((x) => x.symbol === symbol);
  try {
    if (i.done) { haptic(); await api("/api/done/" + encodeURIComponent(symbol), { method: "DELETE" }); }
    else { haptic("ok"); await api("/api/done", { method: "POST", body: JSON.stringify({ symbol, amount: i.amount, price: i.price, mult: i.mult }) }); }
    await load();
  } catch (e) { toast(e.message); }
}

let backTo = null;
function tgBack() { if (backTo) backTo(); }
function setBack(fn) { backTo = fn; try { if (tg && tg.BackButton) { fn ? tg.BackButton.show() : tg.BackButton.hide(); } } catch (e) {} }
try { tg && tg.BackButton && tg.BackButton.onClick(tgBack); } catch (e) {}
function openSheet(html, full) {
  $("sheet").className = "sheet" + (full ? " full" : "");
  $("sheet").innerHTML = (full ? "" : '<div class="grab"></div>') + html; $("veil").classList.add("open"); $("sheet").scrollTop = 0;
  if (!full) setBack(null);
}
function closeSheet() { $("veil").classList.remove("open"); setBack(null); document.activeElement && document.activeElement.blur(); }
$("veil").addEventListener("click", (e) => { if (e.target.id === "veil") closeSheet(); });

// ---------- рынок сейчас: правила стратегии со шкалами ----------
function gauge(c) {
  if (c.value == null) return `<div class="g"><div class="gl"><span>${esc(c.name)}</span><em>нет данных</em></div></div>`;
  const pos = (v) => Math.min(100, Math.max(0, ((v - c.lo) / (c.hi - c.lo)) * 100)), t = pos(c.target), f = (v) => v.toLocaleString("ru-RU", { maximumFractionDigits: c.digits, minimumFractionDigits: c.digits }) + c.unit;
  const zone = c.op === "<" ? `left:0;width:${t}%` : `left:${t}%;right:0`;
  const gap = Math.abs(c.value - c.target), need = c.ok ? "выполнено" : `нужно ${c.op === "<" ? "ниже" : "выше"} ${f(c.target)}`;
  const trend = c.week == null || Math.abs(c.value - c.week) < (c.hi - c.lo) / 200 ? "" : (c.value > c.week ? " ↑" : " ↓");
  return `<div class="g"><div class="gl"><span>${esc(c.name)}</span><em class="${c.ok ? "ok" : ""}">${f(c.value)}${trend} · ${need}</em></div>
    <div class="bar"><div class="zone" style="${zone}"></div><div class="mark" style="left:${t}%"></div>${c.week == null ? "" : `<div class="ghost" style="left:${pos(c.week)}%"></div>`}<div class="dot ${c.ok ? "ok" : ""}" style="left:${pos(c.value)}%"></div></div></div>`;
}
function market(i) {
  if (!i.state) return "";
  return `<h3>Рынок сейчас</h3>` + i.state.map((r, n) => {
    const on = n === i.rule, all = r.conds.every((c) => c.ok), left = r.conds.filter((c) => !c.ok).length;
    const tag = on ? "сейчас · " + esc(r.what) : all ? "выполнено, но раньше сработало другое" : left === r.conds.length ? esc(r.what) : `осталось ${left} из ${r.conds.length}`;
    return `<div class="rule ${on ? "on" : ""} ${r.kind}" onclick="this.querySelector('p').hidden = !this.querySelector('p').hidden">
      <div class="rh"><b>${esc(r.title)}</b><span>${tag}</span></div>${r.conds.map(gauge).join("")}<p ${on ? "" : "hidden"}>${esc(r.why)}</p></div>`;
  }).join("") + `<div class="note">Правила проверяются сверху вниз, срабатывает первое выполненное. Серая точка — где показатель был неделю назад.</div>`;
}
function actionCard(i) {
  if (!i.reserve_mode) return scale(i);
  const a = i.plan_today, kind = a < 0 ? "sell" : a > 1 ? "buy" : "", r = i.state && i.rule >= 0 ? i.state[i.rule] : null;
  const head = i.nothing_to_sell ? "Продавать нечего" : a < 0 ? `Продать ${Math.round(-a * 100)}% · $${big(-i.amount)}` : i.amount > 0 ? `Купить на $${big(i.amount)}` : "Без сделки";
  const sub = i.nothing_to_sell ? "Сигнал на продажу, но позиции пока нет. Сегодняшний взнос остаётся в резерве." : r ? r.why : "Сигналов нет — обычный ежедневный взнос.";
  return `<div class="act ${kind}"><b>${head}</b><p>${esc(sub)}</p></div>`;
}
function position(i) {
  const cells = [["В активе", "$" + big(i.holding || 0)], ["Количество", i.qty ? qty(i.qty) : "—"], ["Средняя цена", i.avg_price ? "$" + qty(i.avg_price) : "—"]];
  if (i.reserve != null) cells.push(["В резерве", "$" + big(i.reserve)]);
  const p = i.profit || 0, has = i.trades > 0;
  return `<h3>Мой счёт</h3><div class="grid">${cells.map(([a, b]) => `<div class="cell"><small>${a}</small><b class="num">${b}</b></div>`).join("")}
    <div class="cell" style="grid-column: 1 / -1"><small>Результат по сделкам</small><b class="num ${!has ? "" : p >= 0 ? "up" : "down"}">${has ? (p >= 0 ? "+" : "−") + "$" + big(Math.abs(p)) : "сделок пока нет"}</b></div></div>
    <div class="row2"><button class="btn main" onclick="startScan('${esc(i.symbol)}')">Скриншот сделки</button><button class="btn" onclick="tradeForm({ symbol: '${esc(i.symbol)}' })">Вручную</button></div>
    <div id="trades"></div>`;
}
async function trades(symbol) {
  const box = $("trades"); if (!box) return;
  try {
    const t = await api("/api/trades?symbol=" + encodeURIComponent(symbol));
    const SRC = { plan: "по плану", scan: "со скриншота", manual: "вручную" };
    box.innerHTML = t.length ? `<h3>Сделки</h3>` + t.slice(0, 30).map((x) => `<div class="tr"><div><b class="${x.side === "sell" ? "s" : ""}">${x.side === "sell" ? "Продажа" : "Покупка"}</b>
      <small>${new Date(x.day + "T00:00:00Z").toLocaleDateString("ru-RU", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" })} · ${SRC[x.source] || ""} · ${qty(x.qty)} по $${qty(x.price)}</small></div>
      <b class="num ${x.side === "sell" ? "s" : ""}">${x.side === "sell" ? "−" : ""}$${big(x.amount)}</b><button class="x" onclick="dropTrade(${x.id}, '${esc(symbol)}')" aria-label="Удалить сделку">×</button></div>`).join("") : "";
  } catch (e) { box.innerHTML = ""; }
}
function dropTrade(id, symbol) {
  const go = async () => { try { await api("/api/trades/" + id, { method: "DELETE" }); await load(); openTicker(symbol); } catch (e) { toast(e.message); } };
  if (tg && tg.showConfirm && initData) tg.showConfirm("Удалить сделку из журнала?", (ok) => ok && go()); else if (confirm("Удалить сделку из журнала?")) go();
}

function scale(i) {
  if (!i.edges || i.value == null) return "";
  const e = i.edges, lo = e[0] - (e[1] - e[0]), hi = e[2] + (e[2] - e[1]), bounds = [lo, e[0], e[1], e[2], hi];
  let pos = 0; const v = Math.min(Math.max(i.value, lo), hi);
  for (let k = 0; k < 4; k++) if (v >= bounds[k]) pos = (k + (v - bounds[k]) / (bounds[k + 1] - bounds[k])) * 25;
  return `<div class="act"><b>${i.mult > 0 ? "Купить ×" + i.mult : i.mult < 0 ? "Продать ×" + -i.mult : "Пропуск"}</b><p>${esc(i.label || "")}</p>
    <div class="g"><div class="bar"><div class="dot" style="left:${Math.min(Math.max(pos, 1), 99)}%"></div></div></div></div>`;
}

let hist = {}, view = { period: "all" };
async function history(symbol) { if (!hist[symbol]) hist[symbol] = await api("/api/history/" + encodeURIComponent(symbol)); return hist[symbol]; }
function openTicker(symbol) {
  const i = state.items.find((x) => x.symbol === symbol), s = esc(symbol);
  if (!i) return closeSheet();
  const price = i.price ? Number(i.price).toLocaleString("ru-RU", { maximumSignificantDigits: 6 }) + " " + esc(i.currency || "") : esc(i.name || "");
  openSheet(`<div class="head"><div><div class="title">${esc(short(symbol))}</div><div class="price num">${price} · ${esc(i.strategy_name)}</div></div>
      <button class="icon" onclick="removeTicker('${s}')" aria-label="Удалить"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg></button></div>
    ${i.error ? `<div class="note warn">${esc(i.error)}</div>` : actionCard(i) + market(i) + position(i)}
    <h3>Стратегии на истории</h3><div id="strats"><div class="hint">Считаю историю…</div></div>
    <h3>Ежедневный взнос</h3><div class="field"><span>$</span><input id="unitIn" type="number" inputmode="decimal" min="1" value="${i.custom_unit ?? ""}" placeholder="${num(state.unit)}" onchange="saveUnit('${s}')"><em>в день</em></div>`);
  trades(symbol); strategies(symbol);
}
async function strategies(symbol) {
  const i = state.items.find((x) => x.symbol === symbol);
  let h;
  try { h = await history(symbol); } catch (e) { const b = $("strats"); if (b) b.innerHTML = '<div class="hint">' + esc(e.message) + "</div>"; return; }
  const box = $("strats"); if (!box) return;
  Explorer.list(box, h, { period: view.period, active: i.strategy, unit: i.unit, onPeriod: (p) => { view.period = p; strategies(symbol); }, onOpen: (code) => openStrategy(symbol, code) });
}
async function openStrategy(symbol, code) {
  const i = state.items.find((x) => x.symbol === symbol), h = await history(symbol);
  openSheet('<div id="detail"></div>', true);
  setBack(() => openTicker(symbol));
  Explorer.detail($("detail"), h, code, { period: view.period, active: i.strategy, unit: i.unit,
    onPeriod: (p) => { view.period = p; openStrategy(symbol, code); }, onBack: () => openTicker(symbol), onSelect: (c) => setStrategy(symbol, c) });
}
async function setStrategy(symbol, strategy) {
  haptic("ok");
  try { await api("/api/tickers/" + encodeURIComponent(symbol), { method: "PATCH", body: JSON.stringify({ strategy }) }); await load(); openTicker(symbol); }
  catch (e) { toast(e.message); }
}
async function saveUnit(symbol) {
  const v = $("unitIn").value.trim();
  try { await api("/api/tickers/" + encodeURIComponent(symbol), { method: "PATCH", body: JSON.stringify(v === "" ? { reset_unit: true } : { unit: Number(v) }) }); await load(); }
  catch (e) { toast(e.message); }
}
function removeTicker(symbol) {
  const go = async () => { try { await api("/api/tickers/" + encodeURIComponent(symbol), { method: "DELETE" }); closeSheet(); await load(); } catch (e) { toast(e.message); } };
  const q = "Удалить " + short(symbol) + "?";
  if (tg && tg.showConfirm && initData) tg.showConfirm(q, (ok) => ok && go()); else if (confirm(q)) go();
}

// ---------- сделка со скриншота: распознать → показать → записать только после подтверждения ----------
let draft = null;
function startScan(symbol) {
  draft = { symbol: symbol || null };
  if (state && !state.scan) { toast("Распознавание не настроено — введите сделку вручную"); return tradeForm(draft); }
  $("file").value = ""; $("file").click();
}
$("scanFab").addEventListener("click", () => { haptic(); startScan(null); });
function shrink(file) {          // уменьшаем снимок до 1600 пикселей по длинной стороне: текст остаётся читаемым, а запрос лёгким
  return new Promise((ok, bad) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.88)); };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error("Не получилось открыть картинку")); };
    img.src = url;
  });
}
$("file").addEventListener("change", async (e) => {
  const f = e.target.files[0]; if (!f) return;
  openSheet('<div class="spin"></div><div class="hint">Читаю скриншот…</div>');
  try {
    const url = await shrink(f), r = await api("/api/scan", { method: "POST", body: JSON.stringify({ image: url.split(",")[1], media_type: "image/jpeg" }) });
    if (!r.found) { toast(r.note || "На скриншоте не нашлось сделки"); return tradeForm({ ...draft, shot: url, note: r.note, warn: true }); }
    tradeForm({ symbol: draft.symbol || r.symbol, asset: r.asset, side: r.side, amount: r.amount_usd, qty: r.quantity, price: r.price, fee: r.fee_usd, day: r.date, note: r.note, computed: r.computed || [], shot: url, scanned: true,
      warn: !!(r.currency && !/^USD[TC]?$/i.test(r.currency) && r.amount_usd == null) });
  } catch (err) { toast(err.message); tradeForm({ ...draft }); }
});
function tradeForm(d) {
  draft = { side: "buy", day: state.day, ...d, side: d.side || "buy", day: d.day || state.day };
  const coins = state.items.map((i) => i.symbol), v = (x) => (x == null ? "" : x), mark = (k) => (draft.computed || []).includes(k) ? " · посчитано" : "";
  const unknown = draft.scanned && !draft.symbol;
  openSheet(`<div class="title">${draft.scanned ? "Проверьте сделку" : "Новая сделка"}</div>
    ${draft.shot ? `<img class="shot" src="${draft.shot}" alt="Скриншот сделки">` : ""}
    ${draft.note ? `<div class="note ${draft.warn ? "warn" : ""}">${esc(draft.note)}</div>` : ""}
    ${unknown ? `<div class="note warn">На скриншоте ${esc(draft.asset || "актив")}, которого нет в вашем списке. Выберите тикер ниже или сначала добавьте его.</div>` : ""}
    <div class="pills" id="fCoins">${coins.map((c) => `<button class="pill ${c === draft.symbol ? "on" : ""}" data-c="${esc(c)}">${esc(short(c))}</button>`).join("")}</div>
    <div class="pills" id="fSide"><button class="pill ${draft.side === "buy" ? "on" : ""}" data-s="buy">Купил</button><button class="pill ${draft.side === "sell" ? "on" : ""}" data-s="sell">Продал</button></div>
    <div class="field"><span>Сумма, $${mark("amount_usd")}</span><input id="fAmount" type="number" inputmode="decimal" value="${v(draft.amount)}" placeholder="0"></div>
    <div class="field"><span>Количество${mark("quantity")}</span><input id="fQty" type="number" inputmode="decimal" value="${v(draft.qty)}" placeholder="из суммы и цены"></div>
    <div class="field"><span>Цена, $${mark("price")}</span><input id="fPrice" type="number" inputmode="decimal" value="${v(draft.price)}" placeholder="из суммы и количества"></div>
    <div class="field"><span>Дата</span><input id="fDay" type="date" value="${esc(draft.day)}" max="${state.day}"></div>
    <div class="row2"><button class="btn" onclick="closeSheet()">Отмена</button><button class="btn main" id="fSave">Записать</button></div>
    ${draft.scanned ? '<div class="note">В журнал попадёт только то, что в полях выше — поправьте, если что-то прочитано неверно.</div>' : ""}`);
  $("fCoins").addEventListener("click", (e) => { const b = e.target.closest("[data-c]"); if (!b) return; draft.symbol = b.dataset.c; $("fCoins").querySelectorAll(".pill").forEach((x) => x.classList.toggle("on", x === b)); });
  $("fSide").addEventListener("click", (e) => { const b = e.target.closest("[data-s]"); if (!b) return; draft.side = b.dataset.s; $("fSide").querySelectorAll(".pill").forEach((x) => x.classList.toggle("on", x === b)); });
  $("fSave").addEventListener("click", saveTrade);
}
async function saveTrade() {
  const n = (id) => { const x = parseFloat($(id).value); return x > 0 ? x : null; }, amount = n("fAmount"), q = n("fQty"), price = n("fPrice");
  if (!draft.symbol) return toast("Выберите актив");
  if (!amount) return toast("Укажите сумму сделки");
  if (!q && !price) return toast("Нужно количество или цена");
  $("fSave").disabled = true;
  try {
    await api("/api/trades", { method: "POST", body: JSON.stringify({ symbol: draft.symbol, side: draft.side, amount, qty: q, price, fee: draft.fee || 0, day: $("fDay").value || state.day, source: draft.scanned ? "scan" : "manual" }) });
    haptic("ok"); const sym = draft.symbol; await load(); toast("Сделка записана", true); openTicker(sym);
  } catch (e) { toast(e.message); $("fSave").disabled = false; }
}

$("unitChip").addEventListener("click", () => {
  openSheet(`<div class="title">Взнос в день</div><div class="note">Столько каждый день откладывается на каждый актив. Что не потрачено, копится в резерве.</div>
    <div class="field"><span>$</span><input id="unitAll" type="number" inputmode="decimal" min="1" value="${state ? state.unit : 10}" onchange="saveUnitAll()"></div>`);
  setTimeout(() => $("unitAll").select(), 60);
});
async function saveUnitAll() {
  try { await api("/api/unit", { method: "POST", body: JSON.stringify({ unit: Number($("unitAll").value) }) }); closeSheet(); await load(); }
  catch (e) { toast(e.message); }
}

let found = [], searchTimer;
$("fab").addEventListener("click", () => {
  haptic();
  openSheet(`<div class="field l" style="margin-top:0"><input id="q" placeholder="BTC, SPY, gold…" autocomplete="off" autocorrect="off" spellcheck="false"></div><div id="results"></div>`);
  $("q").addEventListener("input", (e) => { clearTimeout(searchTimer); searchTimer = setTimeout(() => doSearch(e.target.value), 320); });
  setTimeout(() => $("q").focus(), 80);
});
async function doSearch(text) {
  const box = $("results");
  if (!text.trim()) { box.innerHTML = ""; return; }
  try {
    found = await api("/api/search?q=" + encodeURIComponent(text));
    const have = new Set(state.items.map((i) => i.symbol));
    const KIND = { CRYPTOCURRENCY: "КРИПТА", EQUITY: "АКЦИЯ", ETF: "ФОНД", INDEX: "ИНДЕКС", FUTURE: "ФЬЮЧЕРС", MUTUALFUND: "ФОНД", CURRENCY: "ВАЛЮТА" };
    box.innerHTML = found.length ? found.map((r, n) => `<div class="res" onclick="addTicker(${n})" style="${have.has(r.symbol) ? "opacity:.35" : ""}">
      <div><b>${esc(r.symbol)}</b><small>${esc(r.name)}</small></div><small>${esc(KIND[r.kind] || r.kind)}</small></div>`).join("") : '<div class="hint">Ничего не найдено</div>';
  } catch (e) { box.innerHTML = '<div class="hint">' + esc(e.message) + "</div>"; }
}
async function addTicker(n) {
  haptic("ok");
  try { await api("/api/tickers", { method: "POST", body: JSON.stringify(found[n]) }); closeSheet(); await load(); }
  catch (e) { toast(e.message); }
}

document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load();
</script>
</body>
